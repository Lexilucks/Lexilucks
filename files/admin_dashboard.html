<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexi Text/Call Funnel - Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid #334155;
      padding-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    /* Stats Row */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
    }

    .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #10b981;
    }

    .stat-change {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 5px;
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    label {
      font-size: 14px;
      color: #cbd5e1;
    }

    select,
    input {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    select:focus,
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }

    /* Table */
    .table-container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    th {
      text-align: left;
      padding: 15px;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid #334155;
    }

    tbody tr:hover {
      background: #0f172a;
    }

    .phone {
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-new {
      background: #3b82f6;
      color: white;
    }

    .status-consented {
      background: #8b5cf6;
      color: white;
    }

    .status-package_selected {
      background: #f59e0b;
      color: white;
    }

    .status-checkout_sent {
      background: #f59e0b;
      color: white;
    }

    .status-paid {
      background: #10b981;
      color: white;
    }

    .status-scheduling_sent {
      background: #10b981;
      color: white;
    }

    .status-completed {
      background: #6366f1;
      color: white;
    }

    .price {
      color: #10b981;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn:hover {
      background: #2563eb;
    }

    .btn-danger {
      background: #ef4444;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-success {
      background: #10b981;
    }

    .btn-success:hover {
      background: #059669;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 10px;
      border-radius: 6px;
      font-family: inherit;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .error {
      background: #7f1d1d;
      color: #fca5a5;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }

    .error.active {
      display: block;
    }

    .success {
      background: #065f46;
      color: #86efac;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }

    .success.active {
      display: block;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .pagination {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .pagination button {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .pagination button:hover:not(:disabled) {
      background: #334155;
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .pagination button.active {
      background: #3b82f6;
      border-color: #3b82f6;
    }
  </style>
<!-- Google Analytics -->

  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "G-H0KETRJV5M");
</script>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 Text/Call Funnel Admin</h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total Requests</div>
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-change">All time</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Paid This Week</div>
        <div class="stat-value" id="stat-paid-week">0</div>
        <div class="stat-change">$<span id="stat-revenue-week">0</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending Calls</div>
        <div class="stat-value" id="stat-pending-calls">0</div>
        <div class="stat-change">Awaiting scheduling</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completion Rate</div>
        <div class="stat-value" id="stat-completion-rate">0%</div>
        <div class="stat-change">Completed / Paid</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <div class="filter-group">
        <label for="filter-status">Status:</label>
        <select id="filter-status" onchange="applyFilters()">
          <option value="">All</option>
          <option value="new">New</option>
          <option value="consented">Consented</option>
          <option value="package_selected">Package Selected</option>
          <option value="checkout_sent">Checkout Sent</option>
          <option value="paid">Paid</option>
          <option value="scheduling_sent">Scheduling Sent</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-package">Package:</label>
        <select id="filter-package" onchange="applyFilters()">
          <option value="">All</option>
          <option value="textList">Text List</option>
          <option value="fanDrop">Fan Drop</option>
          <option value="priorityText">Priority Text</option>
          <option value="realLexiText">Real Lexi Text</option>
          <option value="voice10">Voice 10min</option>
          <option value="video20">Video 20min</option>
          <option value="vip">VIP Experience</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-search">Search:</label>
        <input
          type="text"
          id="filter-search"
          placeholder="Phone or email..."
          onchange="applyFilters()"
        />
      </div>
      <button class="btn" onclick="refreshData()">Refresh</button>
    </div>

    <!-- Table -->
    <div class="table-container">
      <div id="loading" class="loading">
        <div class="spinner"></div>
        Loading requests...
      </div>
      <table id="requests-table" style="display: none">
        <thead>
          <tr>
            <th>Phone</th>
            <th>Package</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Created</th>
            <th>Paid</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
  </div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Request</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="modal-error" class="error"></div>
      <div id="modal-success" class="success"></div>
      <form id="edit-form" onsubmit="saveRequest(event)">
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" id="edit-phone" readonly />
        </div>
        <div class="form-group">
          <label>Package</label>
          <input type="text" id="edit-package" readonly />
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="edit-status">
            <option value="new">New</option>
            <option value="consented">Consented</option>
            <option value="package_selected">Package Selected</option>
            <option value="checkout_sent">Checkout Sent</option>
            <option value="paid">Paid</option>
            <option value="scheduling_sent">Scheduling Sent</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="edit-notes" placeholder="Internal notes..."></textarea>
        </div>
        <button type="submit" class="btn btn-success">Save Changes</button>
      </form>
    </div>
  </div>

  <script>
    // Initialize Supabase
    const SUPABASE_URL = 'https://your-project.supabase.co';
    const SUPABASE_KEY = 'your-anon-key';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPage = 1;
    let pageSize = 20;
    let allRequests = [];
    let filteredRequests = [];
    let currentEditRequest = null;

    // Initialize
    async function init() {
      // Check auth (TODO: implement proper auth)
      const token = localStorage.getItem('admin_token');
      if (!token) {
        window.location.href = '/admin/login.html';
        return;
      }

      await refreshData();
    }

    // Fetch all requests
    async function refreshData() {
      try {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('requests-table').style.display = 'none';

        const { data, error } = await supabase
          .from('fan_requests')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        allRequests = data;
        applyFilters();
      } catch (err) {
        showError('Failed to load requests: ' + err.message);
      }
    }

    // Apply filters
    function applyFilters() {
      const status = document.getElementById('filter-status').value;
      const pkg = document.getElementById('filter-package').value;
      const search = document.getElementById('filter-search').value.toLowerCase();

      filteredRequests = allRequests.filter((req) => {
        const matchStatus = !status || req.status === status;
        const matchPackage = !pkg || req.package_type === pkg;
        const matchSearch =
          !search ||
          req.phone_number.includes(search) ||
          (req.email && req.email.toLowerCase().includes(search));
        return matchStatus && matchPackage && matchSearch;
      });

      currentPage = 1;
      updateTable();
      updateStats();
    }

    // Update table display
    function updateTable() {
      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const pageData = filteredRequests.slice(start, end);

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = pageData
        .map(
          (req) => `
        <tr>
          <td class="phone">${req.phone_number}</td>
          <td>${formatPackage(req.package_type)}</td>
          <td class="price">$${getPackagePrice(req.package_type)}</td>
          <td><span class="status-badge status-${req.status}">${req.status}</span></td>
          <td>${formatDate(req.created_at)}</td>
          <td>${req.paid_at ? formatDate(req.paid_at) : '—'}</td>
          <td class="actions">
            <button class="btn" onclick="openEditModal('${req.id}')">Edit</button>
            <button class="btn btn-danger" onclick="markComplete('${req.id}')">✓ Done</button>
          </td>
        </tr>
      `
        )
        .join('');

      // Show/hide table
      document.getElementById('requests-table').style.display =
        pageData.length > 0 ? 'block' : 'none';
      document.getElementById('loading').style.display = 'none';

      // Pagination
      updatePagination();
    }

    // Update stats
    function updateStats() {
      const total = filteredRequests.length;
      const paidThisWeek = filteredRequests.filter((r) => {
        if (!r.paid_at) return false;
        const paidDate = new Date(r.paid_at);
        const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
        return paidDate >= weekAgo;
      });
      const revenue = paidThisWeek.reduce(
        (sum, r) => sum + getPackagePrice(r.package_type),
        0
      );
      const pendingCalls = filteredRequests.filter((r) =>
        ['voice10', 'video20', 'vip'].includes(r.package_type)
      ).filter((r) => r.status === 'paid');
      const completed = filteredRequests.filter((r) => r.status === 'completed');
      const paid = filteredRequests.filter((r) => r.status === 'paid');
      const completionRate =
        paid.length > 0 ? Math.round((completed.length / paid.length) * 100) : 0;

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-paid-week').textContent = paidThisWeek.length;
      document.getElementById('stat-revenue-week').textContent = revenue;
      document.getElementById('stat-pending-calls').textContent = pendingCalls.length;
      document.getElementById('stat-completion-rate').textContent = completionRate + '%';
    }

    // Open edit modal
    async function openEditModal(requestId) {
      const request = allRequests.find((r) => r.id === requestId);
      if (!request) return;

      currentEditRequest = request;
      document.getElementById('edit-phone').value = request.phone_number;
      document.getElementById('edit-package').value = request.package_type;
      document.getElementById('edit-status').value = request.status;
      document.getElementById('edit-notes').value = request.request_message || '';

      document.getElementById('edit-modal').classList.add('active');
    }

    // Close modal
    function closeModal() {
      document.getElementById('edit-modal').classList.remove('active');
      currentEditRequest = null;
      document.getElementById('modal-error').classList.remove('active');
      document.getElementById('modal-success').classList.remove('active');
    }

    // Save request changes
    async function saveRequest(e) {
      e.preventDefault();

      try {
        const newStatus = document.getElementById('edit-status').value;

        const { error } = await supabase
          .from('fan_requests')
          .update({
            status: newStatus,
            updated_at: new Date().toISOString(),
          })
          .eq('id', currentEditRequest.id);

        if (error) throw error;

        showSuccess('Request updated successfully');
        setTimeout(() => {
          closeModal();
          refreshData();
        }, 1000);
      } catch (err) {
        showError('Failed to save: ' + err.message);
      }
    }

    // Mark request as complete
    async function markComplete(requestId) {
      try {
        const { error } = await supabase
          .from('fan_requests')
          .update({
            status: 'completed',
            completed_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
          })
          .eq('id', requestId);

        if (error) throw error;

        showSuccess('Marked as complete!');
        refreshData();
      } catch (err) {
        showError('Failed to mark complete: ' + err.message);
      }
    }

    // Pagination
    function updatePagination() {
      const totalPages = Math.ceil(filteredRequests.length / pageSize);
      const container = document.getElementById('pagination');
      container.innerHTML = '';

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = i === currentPage ? 'active' : '';
        btn.onclick = () => {
          currentPage = i;
          updateTable();
        };
        container.appendChild(btn);
      }
    }

    // Helpers
    function formatPackage(pkg) {
      const map = {
        textList: 'Text List',
        fanDrop: 'Fan Drop',
        priorityText: 'Priority Text',
        realLexiText: 'Real Lexi Text',
        voice10: 'Voice 10min',
        video20: 'Video 20min',
        vip: 'VIP Experience',
      };
      return map[pkg] || pkg;
    }

    function getPackagePrice(pkg) {
      const map = {
        textList: 9,
        fanDrop: 19,
        priorityText: 29,
        realLexiText: 49,
        voice10: 49,
        video20: 99,
        vip: 199,
      };
      return map[pkg] || 0;
    }

    function formatDate(date) {
      return new Date(date).toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric',
      });
    }

    function showError(msg) {
      const el = document.getElementById('modal-error');
      el.textContent = msg;
      el.classList.add('active');
    }

    function showSuccess(msg) {
      const el = document.getElementById('modal-success');
      el.textContent = msg;
      el.classList.add('active');
    }

    function logout() {
      localStorage.removeItem('admin_token');
      window.location.href = '/admin/login.html';
    }

    // Init on load
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
